name: Generate system scan

on:
  schedule: # setiap 12 jam
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: generate system scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet pillow
          python3 .github/scripts/system_scan.py dist

      - name: generate tech stack map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/tech_stack_map.py dist

      - name: push svg to the system-scan branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: system-scan
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
